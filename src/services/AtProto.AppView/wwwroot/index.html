<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>atproto self-host — presence board</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 2rem; color: #111; }
    h1 { font-size: 1.2rem; margin-bottom: .2rem; }
    h1 small { color: #888; font-weight: 400; }
    .bar { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem; }
    .stats { color: #555; }
    #live { font-size: 12px; font-weight: 600; }
    #live.on { color: #0a7d28; }
    #live.off { color: #b00; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; font-variant-numeric: tabular-nums; }
    th { color: #888; font-weight: 600; }
    td.status { font-size: 20px; }
    code { font-size: 12px; color: #444; }
    tr.flash td { animation: flash 1.1s ease-out; }
    @keyframes flash { from { background: #fff6c2; } to { background: transparent; } }
  </style>
</head>
<body>
  <h1>presence board <small>(self-hosted atproto AppView · live over SignalR)</small></h1>
  <div class="bar">
    <span id="live" class="off">○ connecting…</span>
    <span class="stats" id="stats">—</span>
  </div>
  <table>
    <thead><tr><th>#</th><th>status</th><th>did</th><th>rkey</th><th>seq</th><th>updated</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script src="/lib/signalr/signalr.min.js"></script>
  <script>
    const LIMIT = 25;
    const board = new Map(); // did -> { did, rkey, cid, status, seq, updatedAt }

    function render(changed) {
      const rows = [...board.values()].sort((a, b) => b.seq - a.seq).slice(0, LIMIT);
      document.getElementById('rows').innerHTML = rows.map((e, i) =>
        `<tr class="${changed && changed.has(e.did) ? 'flash' : ''}">` +
        `<td>${i + 1}</td><td class="status">${e.status ?? ''}</td>` +
        `<td><code>${e.did}</code></td><td><code>${e.rkey ?? ''}</code></td>` +
        `<td>${e.seq}</td><td>${new Date(e.updatedAt).toLocaleTimeString()}</td></tr>`).join('');
    }

    async function seed() {
      const p = await fetch('/xrpc/place.selfhost.getPresence?limit=' + LIMIT).then(r => r.json());
      board.clear();
      for (const e of p.presence) board.set(e.did, e);
      render();
    }

    function applyDeltas(deltas) {
      const changed = new Set();
      for (const d of deltas) {
        if (d.removed) board.delete(d.did);
        else board.set(d.did, d);
        changed.add(d.did);
      }
      render(changed);
    }

    function setStats(s) {
      document.getElementById('stats').textContent =
        `${s.uniqueUsers} users · ${s.totalUpdates} updates · ${s.updatesPerSecond}/s · seq ${s.lastSeq}`;
    }

    function setLive(on) {
      const el = document.getElementById('live');
      el.textContent = on ? '● live' : '○ offline';
      el.className = on ? 'on' : 'off';
    }

    const conn = new signalR.HubConnectionBuilder()
      .withUrl('/hub/presence')
      .withAutomaticReconnect()
      .build();

    conn.on('presence', applyDeltas);
    conn.on('stats', setStats);
    conn.onreconnecting(() => setLive(false));
    conn.onreconnected(async () => { await seed(); setLive(true); });
    conn.onclose(() => setLive(false));

    (async () => {
      await seed();
      try { await conn.start(); setLive(true); }
      catch { setLive(false); }
    })();
  </script>
</body>
</html>
