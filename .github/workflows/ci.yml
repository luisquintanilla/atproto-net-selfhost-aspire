name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore atproto-net-selfhost-aspire.slnx

      - name: Build
        run: dotnet build atproto-net-selfhost-aspire.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test atproto-net-selfhost-aspire.slnx --configuration Release --no-build --verbosity normal

  pack:
    # Produce preview NuGet packages for the reusable libraries (core + the Aspire integration).
    # These are build artifacts only; nothing is pushed to nuget.org while the API surface settles.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack (preview libraries)
        run: >-
          dotnet pack atproto-net-selfhost-aspire.slnx
          --configuration Release
          -p:ContinuousIntegrationBuild=true
          -o ${{ github.workspace }}/artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack (preview libraries)
        run: >-
          dotnet pack atproto-net-selfhost-aspire.slnx
          --configuration Release
          -p:ContinuousIntegrationBuild=true
          -o ${{ github.workspace }}/artifacts/packages

      - name: Push packages to GitHub Packages
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/packages/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/luisquintanilla/index.json
          --skip-duplicate
