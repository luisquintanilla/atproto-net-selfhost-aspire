name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore atproto-net-selfhost-aspire.slnx

      - name: Build
        run: dotnet build atproto-net-selfhost-aspire.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test atproto-net-selfhost-aspire.slnx --configuration Release --no-build --verbosity normal
