name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Configure GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget add source
          https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --name github-packages
          --username "${{ github.actor }}"
          --password "$GITHUB_PACKAGES_TOKEN"
          --store-password-in-clear-text

      - name: Restore
        run: dotnet restore atproto-net-selfhost-aspire.slnx

      - name: Build
        run: dotnet build atproto-net-selfhost-aspire.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test atproto-net-selfhost-aspire.slnx --configuration Release --no-build --verbosity normal

  pack:
    # Produce a preview package for the Aspire hosting integration. Shared protocol packages are
    # built and published by the standalone shared-core repository.
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Configure GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget add source
          https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --name github-packages
          --username "${{ github.actor }}"
          --password "$GITHUB_PACKAGES_TOKEN"
          --store-password-in-clear-text

      - name: Pack Aspire hosting integration
        run: >-
          dotnet pack src/aspire/AtProto.Hosting.Atproto/AtProto.Hosting.Atproto.csproj
          --configuration Release
          -p:ContinuousIntegrationBuild=true
          -o ${{ github.workspace }}/artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Configure GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget add source
          https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --name github-packages
          --username "${{ github.actor }}"
          --password "$GITHUB_PACKAGES_TOKEN"
          --store-password-in-clear-text

      - name: Pack Aspire hosting integration
        run: >-
          dotnet pack src/aspire/AtProto.Hosting.Atproto/AtProto.Hosting.Atproto.csproj
          --configuration Release
          -p:ContinuousIntegrationBuild=true
          -o ${{ github.workspace }}/artifacts/packages

      - name: Push packages to GitHub Packages
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/packages/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/luisquintanilla/index.json
          --skip-duplicate
