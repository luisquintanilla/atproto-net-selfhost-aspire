<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a2f4a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa0bd"/></marker><marker id="a-you" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0b341"/></marker><marker id="a-pds" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4ec97a"/></marker><marker id="a-relay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c678dd"/></marker><marker id="a-appview" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7aa2ff"/></marker><marker id="a-browser" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56b6c2"/></marker>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.38"/></filter>
  </defs>
  <rect x="0.75" y="0.75" width="938.5" height="328.5" rx="16" fill="#0f1220" stroke="#2a2f4a" stroke-width="1.5"/>
  
  <text x="30" y="60" fill="#e7e9f3" font-size="20" font-weight="700">Identity you own</text>
  <text x="31" y="80" fill="#9aa0bd" font-size="13">Like a phone number you port between carriers. Your DID never changes; your PDS can.</text><g filter="url(#sh)">
    <rect x="70" y="130" width="200" height="60" rx="12" fill="#171a2b" stroke="#e7e9f3" stroke-width="1.5"/>
    <rect x="70" y="130" width="6" height="60" rx="3" fill="#e7e9f3"/>
  </g>
  <text x="97" y="161" font-size="24" text-anchor="middle" dominant-baseline="central">🏷️</text>
  <text x="116" y="155" fill="#e7e9f3" font-size="15" font-weight="650">@demo1.pds…</text>
  <text x="116" y="173" fill="#9aa0bd" font-size="12"><tspan x="116" dy="0">handle (friendly name)</tspan></text><g filter="url(#sh)">
    <rect x="370" y="122" width="220" height="76" rx="12" fill="#171a2b" stroke="#e0b341" stroke-width="1.5"/>
    <rect x="370" y="122" width="6" height="76" rx="3" fill="#e0b341"/>
  </g>
  <text x="397" y="161" font-size="24" text-anchor="middle" dominant-baseline="central">🔑</text>
  <text x="416" y="155" fill="#e7e9f3" font-size="15" font-weight="650">did:web:…:demo1</text>
  <text x="416" y="173" fill="#9aa0bd" font-size="12"><tspan x="416" dy="0">the number you own (DID)</tspan></text><g filter="url(#sh)">
    <rect x="700" y="110" width="190" height="56" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="700" y="110" width="6" height="56" rx="3" fill="#4ec97a"/>
  </g>
  <text x="727" y="139" font-size="24" text-anchor="middle" dominant-baseline="central">🏠</text>
  <text x="746" y="133" fill="#e7e9f3" font-size="15" font-weight="650">PDS A</text>
  <text x="746" y="151" fill="#9aa0bd" font-size="12"><tspan x="746" dy="0">where the repo lives</tspan><tspan x="746" dy="15">today</tspan></text><g filter="url(#sh)">
    <rect x="700" y="200" width="190" height="56" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="700" y="200" width="6" height="56" rx="3" fill="#4ec97a"/>
  </g>
  <text x="727" y="229" font-size="24" text-anchor="middle" dominant-baseline="central">🏠</text>
  <text x="746" y="223" fill="#e7e9f3" font-size="15" font-weight="650">PDS B</text>
  <text x="746" y="241" fill="#9aa0bd" font-size="12"><tspan x="746" dy="0">move here, keep your</tspan><tspan x="746" dy="15">DID</tspan></text><path d="M270 160 L370 160" fill="none" stroke="#e0b341" stroke-width="2"  marker-end="url(#a-you)"/><g><rect x="283.3" y="149" width="73.4" height="18" rx="5" fill="#1e2238" stroke="#2a2f4a"/><text x="320" y="162.5" fill="#e7e9f3" font-size="11.5" text-anchor="middle">points to</text></g><path d="M590 150 L700 138" fill="none" stroke="#4ec97a" stroke-width="2"  marker-end="url(#a-pds)"/><g><rect x="608.3" y="133" width="73.4" height="18" rx="5" fill="#1e2238" stroke="#2a2f4a"/><text x="645" y="146.5" fill="#e7e9f3" font-size="11.5" text-anchor="middle">hosted on</text></g><path d="M590 168 L700 224" fill="none" stroke="#4ec97a" stroke-width="2"  marker-end="url(#a-pds)"/><g><rect x="624.8" y="185" width="40.4" height="18" rx="5" fill="#1e2238" stroke="#2a2f4a"/><text x="645" y="198.5" fill="#e7e9f3" font-size="11.5" text-anchor="middle">port</text></g><text x="30" y="304" fill="#9aa0bd" font-size="12.5">The handle can change and the PDS can change; the DID is the stable identity everything else resolves through.</text>
</svg>
