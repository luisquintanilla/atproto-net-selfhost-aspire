<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a2f4a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa0bd"/></marker><marker id="a-you" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0b341"/></marker><marker id="a-pds" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4ec97a"/></marker><marker id="a-relay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c678dd"/></marker><marker id="a-appview" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7aa2ff"/></marker><marker id="a-browser" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56b6c2"/></marker>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.38"/></filter>
  </defs>
  <rect x="0.75" y="0.75" width="938.5" height="338.5" rx="16" fill="#0f1220" stroke="#2a2f4a" stroke-width="1.5"/>
  
  <text x="30" y="70" fill="#e7e9f3" font-size="21" font-weight="700">atproto ≈ email + a newswire + a newspaper</text>
  <text x="31" y="94" fill="#9aa0bd" font-size="13.5">Three roles you already understand. The real names are in the cards.</text><g filter="url(#sh)"><rect x="30" y="120" width="250" height="150" rx="14" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/><rect x="30" y="120" width="250" height="6" rx="3" fill="#4ec97a"/></g>
    <text x="54" y="172" font-size="30">📧</text>
    <text x="100" y="164" fill="#e7e9f3" font-size="17" font-weight="700">Your PDS</text>
    <text x="100" y="182" fill="#4ec97a" font-size="11.5">Personal Data Server</text>
    <text x="52" y="212" fill="#9aa0bd" font-size="12.5"><tspan x="52" dy="0">Like your email provider. Your</tspan><tspan x="52" dy="17">data lives here; switch</tspan><tspan x="52" dy="17">providers and keep your address.</tspan></text><path d="M280 195 L345 195" fill="none" stroke="#c678dd" stroke-width="2"  marker-end="url(#a-relay)"/><g><rect x="279.1" y="184" width="66.8" height="18" rx="5" fill="#1e2238" stroke="#2a2f4a"/><text x="312.5" y="197.5" fill="#e7e9f3" font-size="11.5" text-anchor="middle">firehose</text></g><g filter="url(#sh)"><rect x="345" y="120" width="250" height="150" rx="14" fill="#171a2b" stroke="#c678dd" stroke-width="1.5"/><rect x="345" y="120" width="250" height="6" rx="3" fill="#c678dd"/></g>
    <text x="369" y="172" font-size="30">📡</text>
    <text x="415" y="164" fill="#e7e9f3" font-size="17" font-weight="700">The Relay</text>
    <text x="415" y="182" fill="#c678dd" font-size="11.5">aggregator</text>
    <text x="367" y="212" fill="#9aa0bd" font-size="12.5"><tspan x="367" dy="0">Like a newswire. It gathers</tspan><tspan x="367" dy="17">everyone's public activity into</tspan><tspan x="367" dy="17">one feed, the firehose.</tspan></text><path d="M595 195 L660 195" fill="none" stroke="#7aa2ff" stroke-width="2"  marker-end="url(#a-appview)"/><g><rect x="594.1" y="184" width="66.8" height="18" rx="5" fill="#1e2238" stroke="#2a2f4a"/><text x="627.5" y="197.5" fill="#e7e9f3" font-size="11.5" text-anchor="middle">firehose</text></g><g filter="url(#sh)"><rect x="660" y="120" width="250" height="150" rx="14" fill="#171a2b" stroke="#7aa2ff" stroke-width="1.5"/><rect x="660" y="120" width="250" height="6" rx="3" fill="#7aa2ff"/></g>
    <text x="684" y="172" font-size="30">📰</text>
    <text x="730" y="164" fill="#e7e9f3" font-size="17" font-weight="700">The AppView</text>
    <text x="730" y="182" fill="#7aa2ff" font-size="11.5">index / app</text>
    <text x="682" y="212" fill="#9aa0bd" font-size="12.5"><tspan x="682" dy="0">Like a newspaper. It reads the</tspan><tspan x="682" dy="17">wire and builds something you</tspan><tspan x="682" dy="17">can actually browse.</tspan></text><text x="30" y="312" fill="#9aa0bd" font-size="12.5">Your data flows left → right: it is created once on your PDS, aggregated by the Relay, and read by any number of AppViews.</text>
</svg>
