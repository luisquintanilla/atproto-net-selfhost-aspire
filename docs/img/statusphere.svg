<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a2f4a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa0bd"/></marker><marker id="a-you" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0b341"/></marker><marker id="a-pds" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4ec97a"/></marker><marker id="a-relay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c678dd"/></marker><marker id="a-appview" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7aa2ff"/></marker><marker id="a-browser" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56b6c2"/></marker>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.38"/></filter>
  </defs>
  <rect x="0.75" y="0.75" width="898.5" height="258.5" rx="16" fill="#0f1220" stroke="#2a2f4a" stroke-width="1.5"/>
  
  <text x="30" y="60" fill="#e7e9f3" font-size="20" font-weight="700">The real-world anchor: Statusphere</text>
  <text x="31" y="80" fill="#9aa0bd" font-size="13">Our demo lexicon is essentially Bluesky's official teaching app — one emoji status per person, latest wins.</text><g filter="url(#sh)">
    <rect x="30" y="108" width="180" height="60" rx="12" fill="#171a2b" stroke="#e0b341" stroke-width="1.5"/>
    <rect x="30" y="108" width="6" height="60" rx="3" fill="#e0b341"/>
  </g>
  <text x="57" y="139" font-size="24" text-anchor="middle" dominant-baseline="central">🧑</text>
  <text x="76" y="143" fill="#e7e9f3" font-size="15" font-weight="650">pick an emoji</text>
  <path d="M210 138 L250 138" fill="none" stroke="#4ec97a" stroke-width="2"  marker-end="url(#a-pds)"/><g filter="url(#sh)">
    <rect x="250" y="108" width="180" height="60" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="250" y="108" width="6" height="60" rx="3" fill="#4ec97a"/>
  </g>
  <text x="277" y="139" font-size="24" text-anchor="middle" dominant-baseline="central">🏠</text>
  <text x="296" y="133" fill="#e7e9f3" font-size="15" font-weight="650">record</text>
  <text x="296" y="151" fill="#9aa0bd" font-size="12"><tspan x="296" dy="0">…status/self</tspan></text><path d="M430 138 L490 138" fill="none" stroke="#c678dd" stroke-width="2"  marker-end="url(#a-relay)"/><g filter="url(#sh)">
    <rect x="490" y="108" width="180" height="60" rx="12" fill="#171a2b" stroke="#c678dd" stroke-width="1.5"/>
    <rect x="490" y="108" width="6" height="60" rx="3" fill="#c678dd"/>
  </g>
  <text x="517" y="139" font-size="24" text-anchor="middle" dominant-baseline="central">📡</text>
  <text x="536" y="133" fill="#e7e9f3" font-size="15" font-weight="650">firehose</text>
  <text x="536" y="151" fill="#9aa0bd" font-size="12"><tspan x="536" dy="0">→ relay</tspan></text><path d="M670 138 L710 138" fill="none" stroke="#7aa2ff" stroke-width="2"  marker-end="url(#a-appview)"/><g filter="url(#sh)">
    <rect x="710" y="108" width="180" height="60" rx="12" fill="#171a2b" stroke="#7aa2ff" stroke-width="1.5"/>
    <rect x="710" y="108" width="6" height="60" rx="3" fill="#7aa2ff"/>
  </g>
  <text x="737" y="139" font-size="24" text-anchor="middle" dominant-baseline="central">📰</text>
  <text x="756" y="133" fill="#e7e9f3" font-size="15" font-weight="650">board</text>
  <text x="756" y="151" fill="#9aa0bd" font-size="12"><tspan x="756" dy="0">latest per user</tspan></text><text x="30" y="218" fill="#9aa0bd" font-size="12.5">Swap the lexicon (place.selfhost.status) for your own NSID and the same three services host a different app.</text>
</svg>
