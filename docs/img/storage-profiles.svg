  <rect x="0.75" y="0.75" width="978.5" height="428.5" rx="16" fill="#0f1220" stroke="#2a2f4a" stroke-width="1.5"/>
  <text x="26" y="34" fill="#9aa0bd" font-size="12.5" letter-spacing="0.09em" font-weight="600">DEV VS PRODUCTION</text>
  <text x="30" y="58" fill="#e7e9f3" font-size="21" font-weight="700">Storage profiles</text>
  <text x="31" y="80" fill="#9aa0bd" font-size="13">In-memory stays the default. Production opts into durable PDS stores and analytics with one env var.</text><g filter="url(#sh)"><rect x="30" y="104" width="430" height="286" rx="16" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/></g><text x="52" y="138" fill="#e7e9f3" font-size="18" font-weight="700">dev (default)</text><text x="52" y="159" fill="#9aa0bd" font-size="12.5">zero config, nothing on disk</text><g filter="url(#sh)"><rect x="520" y="104" width="430" height="286" rx="16" fill="#171a2b" stroke="#e0b341" stroke-width="1.5"/></g><text x="542" y="138" fill="#e7e9f3" font-size="18" font-weight="700">production</text><text x="542" y="159" fill="#9aa0bd" font-size="12.5">ATPROTO_PROFILE=production</text><path d="M450 246 L520 246" fill="none" stroke="#e0b341" stroke-width="2"  marker-end="url(#a-you)"/><g><rect x="415.3" y="235" width="139.39999999999998" height="18" rx="5" fill="#1e2238" stroke="#2a2f4a"/><text x="485" y="248.5" fill="#e7e9f3" font-size="11.5" text-anchor="middle">same code + env var</text></g><g filter="url(#sh)">
