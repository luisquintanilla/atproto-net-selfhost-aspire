<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a2f4a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa0bd"/></marker><marker id="a-you" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0b341"/></marker><marker id="a-pds" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4ec97a"/></marker><marker id="a-relay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c678dd"/></marker><marker id="a-appview" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7aa2ff"/></marker><marker id="a-browser" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56b6c2"/></marker>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.38"/></filter>
  </defs>
  <rect x="0.75" y="0.75" width="898.5" height="390.5" rx="16" fill="#0f1220" stroke="#2a2f4a" stroke-width="1.5"/>
  
  <text x="30" y="60" fill="#e7e9f3" font-size="20" font-weight="700">atproto data model</text>
  <text x="31" y="80" fill="#9aa0bd" font-size="13">Everything hangs off a signed commit and is addressed by CID.</text><g filter="url(#sh)">
    <rect x="360" y="100" width="180" height="56" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="360" y="100" width="6" height="56" rx="3" fill="#4ec97a"/>
  </g>
  <text x="387" y="129" font-size="24" text-anchor="middle" dominant-baseline="central">🔏</text>
  <text x="406" y="123" fill="#e7e9f3" font-size="15" font-weight="650">Commit</text>
  <text x="406" y="141" fill="#9aa0bd" font-size="12"><tspan x="406" dy="0">signed root</tspan></text><g filter="url(#sh)">
    <rect x="360" y="190" width="180" height="56" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="360" y="190" width="6" height="56" rx="3" fill="#4ec97a"/>
  </g>
  <text x="387" y="219" font-size="24" text-anchor="middle" dominant-baseline="central">🌳</text>
  <text x="406" y="213" fill="#e7e9f3" font-size="15" font-weight="650">MST root</text>
  <text x="406" y="231" fill="#9aa0bd" font-size="12"><tspan x="406" dy="0">Merkle tree</tspan></text><g filter="url(#sh)">
    <rect x="120" y="280" width="220" height="54" rx="12" fill="#171a2b" stroke="#7aa2ff" stroke-width="1.5"/>
    <rect x="120" y="280" width="6" height="54" rx="3" fill="#7aa2ff"/>
  </g>
  <text x="147" y="308" font-size="24" text-anchor="middle" dominant-baseline="central">📄</text>
  <text x="166" y="302" fill="#e7e9f3" font-size="15" font-weight="650">place.selfhost.status/self</text>
  <text x="166" y="320" fill="#9aa0bd" font-size="12"><tspan x="166" dy="0">record → value + CID</tspan></text><g filter="url(#sh)">
    <rect x="560" y="280" width="220" height="54" rx="12" fill="#171a2b" stroke="#7aa2ff" stroke-width="1.5"/>
    <rect x="560" y="280" width="6" height="54" rx="3" fill="#7aa2ff"/>
  </g>
  <text x="587" y="308" font-size="24" text-anchor="middle" dominant-baseline="central">📄</text>
  <text x="606" y="302" fill="#e7e9f3" font-size="15" font-weight="650">…/other collections</text>
  <text x="606" y="320" fill="#9aa0bd" font-size="12"><tspan x="606" dy="0">record → value + CID</tspan></text><g filter="url(#sh)">
    <rect x="680" y="100" width="190" height="56" rx="12" fill="#171a2b" stroke="#c678dd" stroke-width="1.5"/>
    <rect x="680" y="100" width="6" height="56" rx="3" fill="#c678dd"/>
  </g>
  <text x="707" y="129" font-size="24" text-anchor="middle" dominant-baseline="central">🗜️</text>
  <text x="726" y="123" fill="#e7e9f3" font-size="15" font-weight="650">CAR</text>
  <text x="726" y="141" fill="#9aa0bd" font-size="12"><tspan x="726" dy="0">blocks by CID</tspan></text><path d="M450 156 L450 190" fill="none" stroke="#4ec97a" stroke-width="2"  marker-end="url(#a-pds)"/><path d="M410 246 L250 280" fill="none" stroke="#7aa2ff" stroke-width="2"  marker-end="url(#a-appview)"/><path d="M490 246 L660 280" fill="none" stroke="#7aa2ff" stroke-width="2"  marker-end="url(#a-appview)"/><path d="M540 128 L680 128" fill="none" stroke="#c678dd" stroke-width="2"  marker-end="url(#a-relay)"/><g><rect x="553.5" y="117" width="113" height="18" rx="5" fill="#1e2238" stroke="#2a2f4a"/><text x="610" y="130.5" fill="#e7e9f3" font-size="11.5" text-anchor="middle">getRepo exports</text></g><text x="30" y="368" fill="#9aa0bd" font-size="12.5">A CID is a hash of the content it names, so identical content shares a CID and any change is detectable.</text>
</svg>
