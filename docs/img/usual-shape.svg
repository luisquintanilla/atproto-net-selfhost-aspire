  <text x="736" y="190" fill="#e7e9f3" font-size="15" font-weight="650">AppView</text>
  <text x="736" y="208" fill="#9aa0bd" font-size="12"><tspan x="736" dy="0">indexes the firehose for</tspan><tspan x="736" dy="15">clients</tspan></text><path d="M230 126 L360 195" fill="none" stroke="#4ec97a" stroke-width="2"  marker-end="url(#a-pds)"/><path d="M230 194 L360 195" fill="none" stroke="#4ec97a" stroke-width="2"  marker-end="url(#a-pds)"/><path d="M230 262 L360 195" fill="none" stroke="#4ec97a" stroke-width="2"  marker-end="url(#a-pds)"/><path d="M550 195 L690 195" fill="none" stroke="#7aa2ff" stroke-width="2"  marker-end="url(#a-appview)"/><g><rect x="566.8" y="184" width="106.39999999999999" height="18" rx="5" fill="#1e2238" stroke="#2a2f4a"/><text x="620" y="197.5" fill="#e7e9f3" font-size="11.5" text-anchor="middle">subscribeRepos</text></g><g><rect x="360" y="262" width="255.6" height="22" rx="11" fill="#1e2238" stroke="#4ec97a"/><text x="487.8" y="277" fill="#e7e9f3" font-size="12" text-anchor="middle">each user hosts their own data (PDS)</text></g><circle cx="36" cy="315" r="6" fill="#4ec97a"/><text x="48" y="319" fill="#9aa0bd" font-size="12">users / PDSes</text><circle cx="159.2" cy="315" r="6" fill="#c678dd"/><text x="171.2" y="319" fill="#9aa0bd" font-size="12">relay / firehose</text><circle cx="301.6" cy="315" r="6" fill="#7aa2ff"/><text x="313.6" y="319" fill="#9aa0bd" font-size="12">appview</text>
