  </g>
  <text x="67" y="127" font-size="24" text-anchor="middle" dominant-baseline="central">🏠</text>
  <text x="86" y="121" fill="#e7e9f3" font-size="15" font-weight="650">alice.pds</text>
  <text x="86" y="139" fill="#9aa0bd" font-size="12"><tspan x="86" dy="0">repo + firehose</tspan></text><g filter="url(#sh)">
    <rect x="40" y="168" width="190" height="52" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="40" y="168" width="6" height="52" rx="3" fill="#4ec97a"/>
  </g>
  <text x="67" y="195" font-size="24" text-anchor="middle" dominant-baseline="central">🏠</text>
  <text x="86" y="189" fill="#e7e9f3" font-size="15" font-weight="650">bob.pds</text>
  <text x="86" y="207" fill="#9aa0bd" font-size="12"><tspan x="86" dy="0">repo + firehose</tspan></text><g filter="url(#sh)">
    <rect x="40" y="236" width="190" height="52" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="40" y="236" width="6" height="52" rx="3" fill="#4ec97a"/>
  </g>
  <text x="67" y="263" font-size="24" text-anchor="middle" dominant-baseline="central">🏠</text>
  <text x="86" y="257" fill="#e7e9f3" font-size="15" font-weight="650">carol.pds</text>
  <text x="86" y="275" fill="#9aa0bd" font-size="12"><tspan x="86" dy="0">repo + firehose</tspan></text><g filter="url(#sh)">
    <rect x="360" y="150" width="190" height="90" rx="12" fill="#171a2b" stroke="#c678dd" stroke-width="1.5"/>
    <rect x="360" y="150" width="6" height="90" rx="3" fill="#c678dd"/>
  </g>
  <text x="387" y="196" font-size="24" text-anchor="middle" dominant-baseline="central">📡</text>
  <text x="406" y="190" fill="#e7e9f3" font-size="15" font-weight="650">Relay</text>
  <text x="406" y="208" fill="#9aa0bd" font-size="12"><tspan x="406" dy="0">aggregates every PDS</tspan><tspan x="406" dy="15">into one firehose</tspan></text><g filter="url(#sh)">
    <rect x="690" y="150" width="210" height="90" rx="12" fill="#171a2b" stroke="#7aa2ff" stroke-width="1.5"/>
