    <text x="96" y="386" fill="#e7e9f3" font-size="14" font-weight="650">Encodings + identity</text><g><rect x="326" y="370" width="90.6" height="22" rx="11" fill="#1e2238" stroke="#4ec97a"/><text x="371.3" y="385" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.Car</text></g><g><rect x="428.6" y="370" width="97.19999999999999" height="22" rx="11" fill="#1e2238" stroke="#4ec97a"/><text x="477.20000000000005" y="385" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.Cbor</text></g><g><rect x="537.8" y="370" width="123.6" height="22" rx="11" fill="#1e2238" stroke="#e0b341"/><text x="599.5999999999999" y="385" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.Identity</text></g><g filter="url(#sh)"><rect x="76" y="420" width="834" height="50" rx="12" fill="#171a2b" stroke="#e0b341" stroke-width="1.5" /><rect x="76" y="420" width="6" height="50" rx="3" fill="#e0b341"/></g>
    <text x="96" y="450" fill="#e7e9f3" font-size="14" font-weight="650">Primitives</text><g><rect x="326" y="434" width="90.6" height="22" rx="11" fill="#1e2238" stroke="#e0b341"/><text x="371.3" y="449" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.Cid</text></g><g><rect x="428.6" y="434" width="110.39999999999999" height="22" rx="11" fill="#1e2238" stroke="#e0b341"/><text x="483.8" y="449" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.Crypto</text></g><g><rect x="551" y="434" width="117" height="22" rx="11" fill="#1e2238" stroke="#e0b341"/><text x="609.5" y="449" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.Lexicon</text></g><g><rect x="680" y="434" width="103.8" height="22" rx="11" fill="#1e2238" stroke="#4ec97a"/><text x="731.9" y="449" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.OAuth</text></g><path d="M50 110 L50 464" fill="none" stroke="#9aa0bd" stroke-width="2"  marker-end="url(#a-muted)"/><text transform="rotate(-90 32 285)" x="32" y="285" text-anchor="middle" fill="#9aa0bd" font-size="11">depends on ↓</text><text x="30" y="498" fill="#9aa0bd" font-size="12.5">Everything from the Aspire integration down ships as a preview package; the hero app on top consumes them and is never packaged.</text>
