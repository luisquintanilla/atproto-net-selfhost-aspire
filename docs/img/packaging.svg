  <rect x="0.75" y="0.75" width="938.5" height="514.5" rx="16" fill="#0f1220" stroke="#2a2f4a" stroke-width="1.5"/>
  <text x="26" y="34" fill="#9aa0bd" font-size="12.5" letter-spacing="0.09em" font-weight="600">PACKAGING / LAYERING</text>
  <text x="30" y="58" fill="#e7e9f3" font-size="21" font-weight="700">Extractable libraries, layered</text>
  <text x="31" y="80" fill="#9aa0bd" font-size="13">Ten preview packages. Each layer depends only on the ones below it, and the core never references a service.</text><g filter="url(#sh)"><rect x="76" y="100" width="834" height="50" rx="12" fill="#171a2b" stroke="#9aa0bd" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="76" y="100" width="6" height="50" rx="3" fill="#9aa0bd"/></g>
    <text x="96" y="122" fill="#e7e9f3" font-size="14" font-weight="650">Hero app</text><text x="96" y="139" fill="#9aa0bd" font-size="11">not packaged</text><g><rect x="326" y="114" width="90.6" height="22" rx="11" fill="#1e2238" stroke="#4ec97a"/><text x="371.3" y="129" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.Pds</text></g><g><rect x="428.6" y="114" width="103.8" height="22" rx="11" fill="#1e2238" stroke="#c678dd"/><text x="480.5" y="129" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.Relay</text></g><g><rect x="544.4" y="114" width="117" height="22" rx="11" fill="#1e2238" stroke="#7aa2ff"/><text x="602.9" y="129" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.AppView</text></g><g><rect x="673.4" y="114" width="44.4" height="22" rx="11" fill="#1e2238" stroke="#9aa0bd"/><text x="695.6" y="129" fill="#e7e9f3" font-size="12" text-anchor="middle">apps</text></g><g><rect x="729.8" y="114" width="64.19999999999999" height="22" rx="11" fill="#1e2238" stroke="#9aa0bd"/><text x="761.9" y="129" fill="#e7e9f3" font-size="12" text-anchor="middle">AppHost</text></g><g filter="url(#sh)"><rect x="76" y="164" width="834" height="50" rx="12" fill="#171a2b" stroke="#7aa2ff" stroke-width="1.5" /><rect x="76" y="164" width="6" height="50" rx="3" fill="#7aa2ff"/></g>
