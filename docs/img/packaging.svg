    <text x="96" y="258" fill="#e7e9f3" font-size="14" font-weight="650">Firehose / ingest</text><g><rect x="326" y="242" width="123.6" height="22" rx="11" fill="#1e2238" stroke="#c678dd"/><text x="387.8" y="257" fill="#e7e9f3" font-size="12" text-anchor="middle">AtProto.Firehose</text></g><g filter="url(#sh)"><rect x="76" y="292" width="834" height="50" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5" /><rect x="76" y="292" width="6" height="50" rx="3" fill="#4ec97a"/></g>
