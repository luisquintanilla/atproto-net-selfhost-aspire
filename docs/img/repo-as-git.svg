<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a2f4a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa0bd"/></marker><marker id="a-you" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0b341"/></marker><marker id="a-pds" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4ec97a"/></marker><marker id="a-relay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c678dd"/></marker><marker id="a-appview" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7aa2ff"/></marker><marker id="a-browser" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56b6c2"/></marker>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.38"/></filter>
  </defs>
  <rect x="0.75" y="0.75" width="938.5" height="328.5" rx="16" fill="#0f1220" stroke="#2a2f4a" stroke-width="1.5"/>
  
  <text x="30" y="60" fill="#e7e9f3" font-size="20" font-weight="700">Your repo is a signed, git-like log</text>
  <text x="31" y="80" fill="#9aa0bd" font-size="13">A content-addressed tree of records. getRepo hands you the whole thing as a CAR file.</text><g filter="url(#sh)">
    <rect x="30" y="118" width="180" height="66" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="30" y="118" width="6" height="66" rx="3" fill="#4ec97a"/>
  </g>
  <text x="57" y="152" font-size="24" text-anchor="middle" dominant-baseline="central">📦</text>
  <text x="76" y="146" fill="#e7e9f3" font-size="15" font-weight="650">Repo</text>
  <text x="76" y="164" fill="#9aa0bd" font-size="12"><tspan x="76" dy="0">all your records</tspan></text><g filter="url(#sh)">
    <rect x="250" y="118" width="180" height="66" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="250" y="118" width="6" height="66" rx="3" fill="#4ec97a"/>
  </g>
  <text x="277" y="152" font-size="24" text-anchor="middle" dominant-baseline="central">🔏</text>
  <text x="296" y="146" fill="#e7e9f3" font-size="15" font-weight="650">Signed commit</text>
  <text x="296" y="164" fill="#9aa0bd" font-size="12"><tspan x="296" dy="0">root + signature</tspan></text><g filter="url(#sh)">
    <rect x="470" y="118" width="170" height="66" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="470" y="118" width="6" height="66" rx="3" fill="#4ec97a"/>
  </g>
  <text x="497" y="152" font-size="24" text-anchor="middle" dominant-baseline="central">🌳</text>
  <text x="516" y="146" fill="#e7e9f3" font-size="15" font-weight="650">MST</text>
  <text x="516" y="164" fill="#9aa0bd" font-size="12"><tspan x="516" dy="0">Merkle search</tspan><tspan x="516" dy="15">tree</tspan></text><g filter="url(#sh)">
    <rect x="680" y="118" width="220" height="66" rx="12" fill="#171a2b" stroke="#7aa2ff" stroke-width="1.5"/>
    <rect x="680" y="118" width="6" height="66" rx="3" fill="#7aa2ff"/>
  </g>
  <text x="707" y="152" font-size="24" text-anchor="middle" dominant-baseline="central">📄</text>
  <text x="726" y="146" fill="#e7e9f3" font-size="15" font-weight="650">records</text>
  <text x="726" y="164" fill="#9aa0bd" font-size="12"><tspan x="726" dy="0">collection / rkey → value</tspan></text><path d="M210 151 L250 151" fill="none" stroke="#4ec97a" stroke-width="2"  marker-end="url(#a-pds)"/><path d="M430 151 L470 151" fill="none" stroke="#4ec97a" stroke-width="2"  marker-end="url(#a-pds)"/><path d="M640 151 L680 151" fill="none" stroke="#7aa2ff" stroke-width="2"  marker-end="url(#a-appview)"/><text x="30" y="236" fill="#9aa0bd" font-size="12.5" letter-spacing="0.06em">IF YOU KNOW GIT</text><g><rect x="30" y="248" width="143.39999999999998" height="22" rx="11" fill="#1e2238" stroke="#2a2f4a"/><text x="101.69999999999999" y="263" fill="#e7e9f3" font-size="12" text-anchor="middle">Commit ≈ git commit</text></g><g><rect x="250" y="248" width="169.79999999999998" height="22" rx="11" fill="#1e2238" stroke="#2a2f4a"/><text x="334.9" y="263" fill="#e7e9f3" font-size="12" text-anchor="middle">MST ≈ git's Merkle tree</text></g><g><rect x="470" y="248" width="163.2" height="22" rx="11" fill="#1e2238" stroke="#2a2f4a"/><text x="551.6" y="263" fill="#e7e9f3" font-size="12" text-anchor="middle">CID ≈ object id (hash)</text></g><g><rect x="690" y="248" width="163.2" height="22" rx="11" fill="#1e2238" stroke="#2a2f4a"/><text x="771.6" y="263" fill="#e7e9f3" font-size="12" text-anchor="middle">CAR ≈ git bundle/clone</text></g><text x="30" y="302" fill="#9aa0bd" font-size="12.5">Every node has a CID (a content hash), so the whole structure is tamper-evident — change one byte and every CID above it changes.</text>
</svg>
