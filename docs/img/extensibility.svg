<svg xmlns="http://www.w3.org/2000/svg" width="950" height="384" viewBox="0 0 950 384" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a2f4a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa0bd"/></marker><marker id="a-you" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0b341"/></marker><marker id="a-pds" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4ec97a"/></marker><marker id="a-relay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c678dd"/></marker><marker id="a-appview" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7aa2ff"/></marker><marker id="a-browser" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56b6c2"/></marker>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.38"/></filter>
  </defs>
  <rect x="0.75" y="0.75" width="948.5" height="382.5" rx="16" fill="#0f1220" stroke="#2a2f4a" stroke-width="1.5"/>
  <text x="26" y="34" fill="#9aa0bd" font-size="12.5" letter-spacing="0.09em" font-weight="600">EXTENSIBILITY MAP</text>
  <text x="30" y="58" fill="#e7e9f3" font-size="21" font-weight="700">Where you plug in</text>
  <text x="31" y="80" fill="#9aa0bd" font-size="13">The stack is a pipeline. Each stage is an extension point, and two concerns cut across all of them.</text><path d="M170 164 L210 164" fill="none" stroke="#4ec97a" stroke-width="2"  marker-end="url(#a-pds)"/><path d="M360 164 L400 164" fill="none" stroke="#c678dd" stroke-width="2"  marker-end="url(#a-relay)"/><path d="M550 164 L590 164" fill="none" stroke="#7aa2ff" stroke-width="2"  marker-end="url(#a-appview)"/><path d="M740 164 L780 164" fill="none" stroke="#56b6c2" stroke-width="2"  marker-end="url(#a-browser)"/><g filter="url(#sh)">
    <rect x="20" y="124" width="150" height="80" rx="12" fill="#171a2b" stroke="#e0b341" stroke-width="1.5"/>
    <rect x="20" y="124" width="6" height="80" rx="3" fill="#e0b341"/>
  </g>
  <text x="47" y="165" font-size="24" text-anchor="middle" dominant-baseline="central">📜</text>
  <text x="66" y="159" fill="#e7e9f3" font-size="15" font-weight="650">Lexicon</text>
  <text x="66" y="177" fill="#9aa0bd" font-size="12"><tspan x="66" dy="0">define your</tspan><tspan x="66" dy="15">record type</tspan></text><circle cx="20" cy="124" r="13" fill="#e0b341" stroke="#0f1220" stroke-width="2.5"/><text x="20" y="128.5" text-anchor="middle" font-size="13" font-weight="800" fill="#0f1220">1</text><g filter="url(#sh)">
    <rect x="210" y="124" width="150" height="80" rx="12" fill="#171a2b" stroke="#4ec97a" stroke-width="1.5"/>
    <rect x="210" y="124" width="6" height="80" rx="3" fill="#4ec97a"/>
  </g>
  <text x="237" y="165" font-size="24" text-anchor="middle" dominant-baseline="central">🏠</text>
  <text x="256" y="159" fill="#e7e9f3" font-size="15" font-weight="650">PDS / repo</text>
  <text x="256" y="177" fill="#9aa0bd" font-size="12"><tspan x="256" dy="0">new record or</tspan><tspan x="256" dy="15">XRPC</tspan></text><circle cx="210" cy="124" r="13" fill="#e0b341" stroke="#0f1220" stroke-width="2.5"/><text x="210" y="128.5" text-anchor="middle" font-size="13" font-weight="800" fill="#0f1220">2</text><g filter="url(#sh)">
    <rect x="400" y="124" width="150" height="80" rx="12" fill="#171a2b" stroke="#c678dd" stroke-width="1.5"/>
