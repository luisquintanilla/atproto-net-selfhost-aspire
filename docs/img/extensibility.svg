  <text x="617" y="165" font-size="24" text-anchor="middle" dominant-baseline="central">📰</text>
  <text x="636" y="159" fill="#e7e9f3" font-size="15" font-weight="650">AppView</text>
  <text x="636" y="177" fill="#9aa0bd" font-size="12"><tspan x="636" dy="0">your</tspan><tspan x="636" dy="15">projection +</tspan><tspan x="636" dy="15">store</tspan></text><circle cx="590" cy="124" r="13" fill="#e0b341" stroke="#0f1220" stroke-width="2.5"/><text x="590" y="128.5" text-anchor="middle" font-size="13" font-weight="800" fill="#0f1220">4</text><g filter="url(#sh)">
    <rect x="780" y="124" width="150" height="80" rx="12" fill="#171a2b" stroke="#56b6c2" stroke-width="1.5"/>
