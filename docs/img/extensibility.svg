  <text x="807" y="165" font-size="24" text-anchor="middle" dominant-baseline="central">🖥️</text>
  <text x="826" y="159" fill="#e7e9f3" font-size="15" font-weight="650">UI + XRPC</text>
  <text x="826" y="177" fill="#9aa0bd" font-size="12"><tspan x="826" dy="0">your endpoints</tspan><tspan x="826" dy="15">+ board</tspan></text><circle cx="780" cy="124" r="13" fill="#e0b341" stroke="#0f1220" stroke-width="2.5"/><text x="780" y="128.5" text-anchor="middle" font-size="13" font-weight="800" fill="#0f1220">5</text><rect x="20" y="232" width="910" height="42" rx="12" fill="#1e2238" stroke="#7aa2ff" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="20" y="232" width="6" height="42" rx="3" fill="#7aa2ff"/><circle cx="46" cy="253" r="13" fill="#7aa2ff" stroke="#0f1220" stroke-width="2.5"/><text x="46" y="257.5" text-anchor="middle" font-size="13" font-weight="800" fill="#0f1220">6</text><text x="72" y="252" fill="#e7e9f3" font-size="14" font-weight="650">Aspire topology</text><text x="72" y="266" fill="#9aa0bd" font-size="12">compose your own stack with AddAtproto* + With*</text><rect x="20" y="288" width="910" height="42" rx="12" fill="#1e2238" stroke="#4ec97a" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="20" y="288" width="6" height="42" rx="3" fill="#4ec97a"/><circle cx="46" cy="309" r="13" fill="#4ec97a" stroke="#0f1220" stroke-width="2.5"/><text x="46" y="313.5" text-anchor="middle" font-size="13" font-weight="800" fill="#0f1220">7</text><text x="72" y="308" fill="#e7e9f3" font-size="14" font-weight="650">Storage</text><text x="72" y="322" fill="#9aa0bd" font-size="12">swap in-memory for durable persistence (follow ICursorStore)</text><circle cx="36" cy="356" r="6" fill="#e0b341"/><text x="48" y="360" fill="#9aa0bd" font-size="12">lexicon</text><circle cx="120.80000000000001" cy="356" r="6" fill="#4ec97a"/><text x="132.8" y="360" fill="#9aa0bd" font-size="12">pds</text><circle cx="180" cy="356" r="6" fill="#c678dd"/><text x="192" y="360" fill="#9aa0bd" font-size="12">firehose</text><circle cx="271.2" cy="356" r="6" fill="#7aa2ff"/><text x="283.2" y="360" fill="#9aa0bd" font-size="12">appview</text><circle cx="356" cy="356" r="6" fill="#56b6c2"/><text x="368" y="360" fill="#9aa0bd" font-size="12">ui</text>
